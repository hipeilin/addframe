<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }

    .wrap {
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 72px;
    }

    /* Generic logo mark — a rounded square with a smaller gradient
       square inside. Swap for your actual logo/icon if you have one. */
    .icon {
      width: 220px;
      height: 220px;
      border-radius: 56px;
      background: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .icon-inner {
      width: 108px;
      height: 108px;
      border-radius: 28px;
      background: linear-gradient(135deg, #6a5cff 0%, #ff5c8a 50%, #ffb35c 100%);
    }

    .text {
      display: flex;
      flex-direction: column;
      max-width: 620px;
    }

    h1 {
      font-size: 76px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111111;
      margin-bottom: 20px;
    }

    p {
      font-size: 30px;
      color: #6b6b6b;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="icon">
      <div class="icon-inner"></div>
    </div>
    <div class="text">
      <!-- CONFIGURE: replace with your site name and a short two-line tagline -->
      <h1>YOUR_SITE_NAME</h1>
      <p>Your one-line value proposition.<br>A second line if useful.</p>
    </div>
  </div>
</body>

</html>
