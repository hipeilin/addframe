<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AddFrame — put a border on your photo</title>
<meta name="description" content="Add a colored border with independently rounded corners to your photo, then export as PNG or JPG. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111111'/%3E%3Crect x='9' y='9' width='14' height='14' rx='4' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>AddFrame</h1>
  <p class="tagline">Add a border to your photo. Nothing ever leaves your browser.</p>
</header>

<main>
  <section class="preview" id="dropzone" tabindex="0" role="button" aria-label="Upload an image">
    <input type="file" id="fileInput" accept="image/*" hidden>
    <div id="placeholder" class="placeholder">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.5"/>
        <path d="M3 16l5-5 4 4 3-3 6 6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="8" cy="8" r="1.6" fill="currentColor"/>
      </svg>
      <p><strong>Drop an image here</strong> or click to upload</p>
    </div>
    <div id="canvasWrap" class="canvas-wrap" hidden>
      <canvas id="canvas"></canvas>
    </div>
  </section>

  <section class="controls" id="controls" aria-label="Frame settings">

    <div class="control-group">
      <label for="borderWidth">Border width</label>
      <div class="control-row">
        <input type="range" id="borderWidth" min="0" max="100" value="24" step="1">
        <span class="value" id="borderWidthValue">24 px</span>
      </div>
    </div>

    <div class="control-group">
      <label for="borderColor">Border color</label>
      <div class="control-row">
        <input type="color" id="borderColor" value="#ffffff">
      </div>
    </div>

    <div class="control-group">
      <label for="borderRadius">Border corner radius</label>
      <div class="control-row">
        <input type="range" id="borderRadius" min="0" max="100" value="0" step="1">
        <span class="value" id="borderRadiusValue">0 px</span>
      </div>
    </div>

    <div class="control-group">
      <label for="imageRadius">Photo corner radius</label>
      <div class="control-row">
        <input type="range" id="imageRadius" min="0" max="100" value="0" step="1">
        <span class="value" id="imageRadiusValue">0 px</span>
      </div>
    </div>

    <hr class="divider">

    <div class="control-group">
      <label for="previewBgColor">Preview background <span class="hint-inline">(reference only, not exported)</span></label>
      <div class="control-row">
        <input type="color" id="previewBgColor" value="#ffffff">
        <button type="button" id="previewBgReset" class="ghost small">Transparent</button>
      </div>
    </div>

    <div class="actions">
      <button id="downloadPng" type="button" class="primary" disabled>Download PNG</button>
      <button id="downloadJpg" type="button" class="primary" disabled>Download JPG</button>
      <button id="reset" type="button" class="ghost" disabled>Start over</button>
    </div>
    <p class="hint">PNG keeps transparent corners. JPG fills them white.</p>
  </section>
</main>

<footer class="site-footer">
  <p>Your image is processed locally and never uploaded. <a href="https://github.com/hipeilin/addframe">Source on GitHub</a></p>
</footer>

<script src="script.js"></script>
</body>
</html>
